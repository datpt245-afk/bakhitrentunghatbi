<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Duck Race - Chuông</title><link rel="stylesheet" href="/style.css">
<style>body{display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}.box{width:min(94vw,520px);text-align:center}.team{font-size:24px;font-weight:900}.name{margin:18px 0}.buzz{display:block;margin:20px auto;width:230px;height:230px;border:0;border-radius:50%;background:#ed4d62;color:#fff;font-size:31px;font-weight:900;box-shadow:0 15px #a52d3d;cursor:pointer;transition:transform 0.05s, background 0.2s}.buzz:active{transform:translateY(10px);box-shadow:0 5px #a52d3d}.buzz:disabled{opacity:.35;cursor:not-allowed;background:#747d8c;box-shadow:none}.status{min-height:30px;font-weight:bold;margin-top:10px}</style></head>
<body><div class="card box"><h1>🔔 DUCK RACE</h1><div class="team" id="team">NHẬP THÔNG TIN ĐỂ VÀO CHUÔNG</div><div id="join">
<input id="name" class="name" placeholder="Nhập tên thành viên" autocomplete="off">
<select id="groupSelect" class="name" style="width:100%;padding:14px;border-radius:10px;font-size:18px;font-weight:700">
<option value="1">Nhóm 1</option><option value="2">Nhóm 2</option><option value="4">Nhóm 4</option><option value="5">Nhóm 5</option><option value="6">Nhóm 6</option>
</select>
<button class="btn primary" style="width:100%;font-size:20px;padding:15px" onclick="join()">VÀO CHUÔNG</button>
</div><div id="play" style="display:none"><div class="muted" id="me"></div><button id="buzz" class="buzz" onclick="buzz()">🔔<br>BẤM CHUÔNG</button><div id="status" class="status">Đang chờ MC mở câu hỏi...</div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
let group="";const s=io();let name="";let currentState=null;
const groupSelect=document.getElementById("groupSelect");
const teamEl=document.getElementById("team");
const statusEl=document.getElementById("status");
teamEl.textContent="NHẬP THÔNG TIN ĐỂ VÀO CHUÔNG";

// Tự động khôi phục tên nếu đã từng nhập
window.addEventListener("DOMContentLoaded", () => {
  const savedName = sessionStorage.getItem("userName");
  const savedGroup = sessionStorage.getItem("userGroup");
  if (savedName && savedGroup) {
    document.getElementById("name").value = savedName;
    group=savedGroup;
    groupSelect.value=group;
    join();
  }
});

function join(){
  name=document.getElementById("name").value.trim();
  group=groupSelect.value;
  if(!name){ alert("Nhập tên trước nhé!"); return; }
  sessionStorage.setItem("userName", name);
  sessionStorage.setItem("userGroup", group);
  teamEl.textContent="NHÓM "+group;
  statusEl.textContent="⏳ Đang kết nối với máy chủ...";
  s.emit("joinMember",{group,name});
}

function updateBuzzButton(st = currentState) {
  const btn = document.getElementById("buzz");
  if (!btn) return;

  // Có người đã giành quyền trả lời -> KHÓA TẤT CẢ chuông khác.
  // Server cũng kiểm tra điều kiện này để chống spam/race condition.
  if (st && st.activeResponder) {
    btn.disabled = true;
    if (String(st.activeResponder.group) === String(group)) {
      statusEl.textContent = "🚨 Bạn đang giữ quyền trả lời. Chờ MC xác nhận đáp án.";
    } else {
      statusEl.textContent = `🔒 Nhóm ${st.activeResponder.group} đang trả lời... Chuông của bạn đã bị khóa.`;
    }
    return;
  }

  const isLocked = st && st.lockedGroups && st.lockedGroups.includes(String(group));
  if (isLocked) {
    btn.disabled = true;
    statusEl.textContent = "❌ Nhóm bạn đã bị khóa ở câu hỏi này.";
    return;
  }

  // Không có người giữ quyền: cho phép bấm.
  btn.disabled = false;
  if (st && !st.questionOpen) {
    statusEl.textContent = "⏳ Đã vào chuông — đang chờ MC mở câu hỏi. Có thể bấm sẵn!";
  }
}

s.on("joined",x=>{
  document.getElementById("join").style.display="none";
  document.getElementById("play").style.display="block";
  document.getElementById("me").textContent="👤 "+x.name+" • Nhóm "+group;
  updateBuzzButton(currentState);
});

function buzz(){
  // Khóa ngay trên máy người chơi để không spam nhiều lần liên tiếp.
  document.getElementById("buzz").disabled=true;
  s.emit("buzz",{group,name});
}

s.on("buzzed",x=>{
  currentState = currentState || {};
  currentState.activeResponder = x;
  updateBuzzButton(currentState);
});

s.on("questionOpened",()=>{
  if (currentState) currentState.questionOpen = true;
  updateBuzzButton(currentState);
  if (!currentState || !currentState.activeResponder) {
    statusEl.textContent="🔔 Câu hỏi đã mở — bấm thật nhanh!";
  }
});

s.on("resetBuzz",()=>{
  updateBuzzButton(currentState);
  if (currentState && !currentState.activeResponder) {
    statusEl.textContent="🔔 Chuông đã mở lại — bấm cướp quyền!";
  }
});

s.on("wrong",x=>{
  if(x.group === group) {
    document.getElementById("buzz").disabled=true;
    statusEl.textContent="❌ MC đã xác nhận sai. Nhóm bạn bị khóa lượt câu này.";
  } else {
    statusEl.textContent=`🔔 Nhóm ${x.group} trả lời sai. Chờ MC mở cướp quyền.`;
  }
  if (currentState) {
    currentState.activeResponder = null;
    if (!currentState.lockedGroups) currentState.lockedGroups=[];
    if (!currentState.lockedGroups.includes(String(x.group))) currentState.lockedGroups.push(String(x.group));
    updateBuzzButton(currentState);
  }
});

s.on("buffChoiceOpened", x=>{
  if(String(x.group)!==String(group)) return;
  document.getElementById("buzz").disabled=true;
  statusEl.textContent="🎁 Đội bạn trả lời đúng. Hãy nói với MC bạn chọn hộp 1, 2 hoặc 3.";
});
s.on("buffBoxChosen", x=>{
  if(String(x.group)!==String(group)) return;
  statusEl.textContent=`🎁 MC đã chọn hộp ${Number(x.choice)+1} theo lựa chọn của đội bạn.`;
});
s.on("buffRevealed", x=>{
  if(String(x.group)!==String(group)) return;
  statusEl.textContent=`🎉 ${x.buff.name}: ${x.buff.desc}`;
});
s.on("buffApplied", x=>{
  if(x.group && String(x.group)!==String(group)) return;
  statusEl.textContent="✅ Buff đã áp dụng. Chờ MC mở câu tiếp theo.";
});
s.on("buffFinished", ()=>{ statusEl.textContent="✅ Buff đã áp dụng. Chờ MC mở câu tiếp theo."; });

s.on("state", st => {
  currentState=st;
  updateBuzzButton(st);
});

s.on("stealOpened", () => {
  if (currentState) {
    currentState.questionOpen = true;
    currentState.activeResponder = null;
  }
  updateBuzzButton(currentState);
  statusEl.textContent="🔔 MC đã mở cướp quyền — bấm chuông cho cùng câu hỏi!";
});

s.on("questionSkipped", () => {
  if (currentState) {
    currentState.questionOpen = false;
    currentState.activeResponder = null;
  }
  document.getElementById("buzz").disabled=true;
  statusEl.textContent = "⏭️ Câu hỏi đã kết thúc. Chờ MC mở câu tiếp theo.";
});

s.on("fullReset", () => {
  sessionStorage.clear();
  location.reload();
});
</script></body></html>
