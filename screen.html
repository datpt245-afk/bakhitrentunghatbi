<!-- Trong screen.html -->
<script>
  // Khởi tạo Audio BGM
  const bgm = new Audio('bgm.mp3'); // Đường dẫn tới file nhạc của bạn
  bgm.loop = true; // Lặp lại liên tục
  bgm.volume = 0.35; // Âm lượng nhạc nền vừa phải để không đè âm thanh hiệu ứng (sFX)

  function startGameMusic() {
    if (!soundEnabled) return;
    bgm.play().catch(e => console.log("Cần tương tác người dùng để phát nhạc:", e));
    gameMusicRunning = true;
    qs("audioToggleBtn").textContent = "🎵 Nhạc Game: ĐANG PHÁT";
  }

  function stopGameMusic() {
    bgm.pause();
    gameMusicRunning = false;
  }

  function toggleAudio() {
    soundEnabled = !soundEnabled;
    const btn = qs("audioToggleBtn");
    if (soundEnabled) {
      startGameMusic();
      btn.textContent = "🎵 Nhạc Game: ĐANG PHÁT";
      btn.style.background = "rgba(56, 189, 248, 0.2)";
      btn.style.color = "#38bdf8";
    } else {
      stopGameMusic();
      btn.textContent = "🔇 Nhạc Game: TẮT";
      btn.style.background = "#64748b";
      btn.style.color = "#fff";
    }
  }
</script>
